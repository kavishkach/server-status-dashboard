name: Docker CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
REGISTRY: ghcr.io
IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t status-dashboard:test .

      - name: Run test container
        run: docker run -d --name status-dashboard-test -p 8080:80 status-dashboard:test

      - name: Wait for application
        run: sleep 3

      - name: Test application health
        run: curl --fail http://localhost:8080

      - name: Show container logs
        if: always()
        run: docker logs status-dashboard-test

      - name: Remove test container
        if: always()
        run: docker rm -f status-dashboard-test

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker tag status-dashboard:test ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest 